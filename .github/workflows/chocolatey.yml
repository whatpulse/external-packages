name: Chocolatey

on:
  # Called by release.yml
  workflow_call:
    inputs:
      version:
        description: 'WhatPulse version (e.g., 5.8.3)'
        required: true
        type: string
      package_fix:
        description: 'Package fix date (YYYYMMDD) when re-releasing the same WhatPulse version'
        required: false
        type: string
        default: ''
      publish:
        description: 'Push the package to community.chocolatey.org'
        required: false
        type: boolean
        default: true

  # Run this target on its own from the GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'WhatPulse version (e.g., 5.8.3)'
        required: true
        type: string
      package_fix:
        description: 'Package fix date (YYYYMMDD), only when re-releasing the same WhatPulse version; gives e.g. 5.8.3.20261013'
        required: false
        type: string
        default: ''
      publish:
        description: 'Push the package to community.chocolatey.org (untick to only build and test-install)'
        type: boolean
        default: true

jobs:
  chocolatey:
    name: Build and push Chocolatey package
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      # Chocolatey package fix version notation: <version>.<YYYYMMDD>
      PACKAGE_VERSION: ${{ inputs.package_fix && format('{0}.{1}', inputs.version, inputs.package_fix) || inputs.version }}
      PACKAGE_DIR: chocolatey/whatpulse
      BUILD_DIR: ${{ github.workspace }}\build\chocolatey
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer and compute SHA256
        id: installer
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            Write-Error 'Error: no version specified'
            exit 1
          }
          $url = "https://releases.whatpulse.org/archives/$env:VERSION/windows/whatpulse-win-$env:VERSION.exe"
          $file = Join-Path $env:RUNNER_TEMP "whatpulse-win-$env:VERSION.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "checksum=$hash" >> $env:GITHUB_OUTPUT

      - name: Render package from template
        shell: pwsh
        env:
          CHECKSUM: ${{ steps.installer.outputs.checksum }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:BUILD_DIR | Out-Null
          Copy-Item -Path "$env:PACKAGE_DIR\*" -Destination $env:BUILD_DIR -Recurse -Force
          Get-ChildItem -Path $env:BUILD_DIR -Recurse -Include *.nuspec, *.ps1 | ForEach-Object {
            (Get-Content -Raw $_.FullName) `
              -replace '\{\{PACKAGE_VERSION\}\}', $env:PACKAGE_VERSION `
              -replace '\{\{VERSION\}\}', $env:VERSION `
              -replace '\{\{CHECKSUM\}\}', $env:CHECKSUM |
              Set-Content -Path $_.FullName -NoNewline
          }
          Write-Host '--- whatpulse.nuspec ---'
          Get-Content "$env:BUILD_DIR\whatpulse.nuspec"
          Write-Host '--- chocolateyinstall.ps1 ---'
          Get-Content "$env:BUILD_DIR\tools\chocolateyinstall.ps1"

      - name: Pack
        shell: pwsh
        run: |
          choco pack "$env:BUILD_DIR\whatpulse.nuspec" --outputdirectory $env:BUILD_DIR
          Get-ChildItem $env:BUILD_DIR -Filter *.nupkg

      - name: Upload .nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatpulse-chocolatey-${{ env.PACKAGE_VERSION }}
          path: ${{ env.BUILD_DIR }}\*.nupkg
          if-no-files-found: error

      # Same checks Chocolatey's moderation verifier runs: install, then uninstall.
      - name: Test install
        shell: pwsh
        run: choco install whatpulse --version $env:PACKAGE_VERSION --source $env:BUILD_DIR --yes --no-progress

      - name: Test uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $proc = Start-Process choco -ArgumentList 'uninstall whatpulse --yes --no-progress' -NoNewWindow -PassThru
          $null = $proc.Handle
          if ($proc.WaitForExit(180000)) {
            exit $proc.ExitCode
          }

          # Hung: show what it is waiting on before the runner kills it.
          Write-Host '::group::Processes'
          Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -match 'WhatPulse|choco|npcap|cscript|wscript' -or $_.Name -match 'WhatPulse|Maintenance|npcap|Uninstall' } |
            Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine | Format-List
          Write-Host '::endgroup::'
          Write-Host '::group::Open windows'
          Get-Process | Where-Object MainWindowTitle | Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize
          Write-Host '::endgroup::'
          Write-Host '::group::chocolatey.log (tail)'
          Get-Content C:\ProgramData\chocolatey\logs\chocolatey.log -Tail 60
          Write-Host '::endgroup::'
          Write-Host '::group::Install directory'
          Get-ChildItem "$env:ProgramFiles\WhatPulse" -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime
          Get-ChildItem "$env:ProgramFiles\WhatPulse" -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Write-Host '::endgroup::'
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Error 'choco uninstall did not finish within 3 minutes'
          exit 1

      - name: Push to community.chocolatey.org
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            Write-Error 'CHOCOLATEY_API_KEY secret is not set'
            exit 1
          }
          $nupkg = Get-ChildItem $env:BUILD_DIR -Filter *.nupkg | Select-Object -First 1
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          Write-Host "Pushed $($nupkg.Name). Moderation status: https://community.chocolatey.org/packages/whatpulse/$env:PACKAGE_VERSION"
