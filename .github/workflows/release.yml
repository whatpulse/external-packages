name: Update External Packages

on:
  # Manual trigger from the GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'WhatPulse version (e.g., 5.8.3)'
        required: true
        type: string
      update_homebrew:
        description: 'Update the Homebrew cask'
        type: boolean
        default: true
      update_winget:
        description: 'Update the winget package'
        type: boolean
        default: true

  # API trigger from the release pipeline (Laravel)
  repository_dispatch:
    types: [new-release]

jobs:
  homebrew:
    name: Trigger Homebrew cask update
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_homebrew) ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.homebrew != false)
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: no version specified"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch update-cask workflow in whatpulse/homebrew-whatpulse
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh api repos/whatpulse/homebrew-whatpulse/dispatches \
            -f event_type=update-cask \
            -f "client_payload[version]=$VERSION"
          echo "Dispatched update-cask for version $VERSION"

  winget:
    name: Submit winget manifest update
    runs-on: windows-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_winget) ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.winget != false)
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'repository_dispatch') {
            $version = '${{ github.event.client_payload.version }}'
          } else {
            $version = '${{ inputs.version }}'
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error 'Error: no version specified'
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify installer is available
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $url = "https://releases.whatpulse.org/latest/windows/whatpulse-win-$version.exe"
          $response = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            Write-Error "Installer not found at $url (HTTP $($response.StatusCode))"
            exit 1
          }
          Write-Host "Installer found: $url"

      - name: Install wingetcreate
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Update manifest and submit PR to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $url = "https://releases.whatpulse.org/latest/windows/whatpulse-win-$version.exe"
          .\wingetcreate.exe update WhatPulse.WhatPulse `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_TOKEN
