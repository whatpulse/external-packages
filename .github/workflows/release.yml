name: Update External Packages

# Orchestrator: resolves the version once, then fans out to the per-target
# workflows (homebrew.yml, winget.yml, chocolatey.yml). Each of those can also
# be run on its own from the Actions tab.

on:
  # Manual trigger from the GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'WhatPulse version (e.g., 5.8.3)'
        required: true
        type: string
      update_homebrew:
        description: 'Update the Homebrew cask'
        type: boolean
        default: true
      update_winget:
        description: 'Update the winget package'
        type: boolean
        default: true
      update_chocolatey:
        description: 'Update the Chocolatey package'
        type: boolean
        default: true

  # API trigger from the release pipeline (Laravel)
  repository_dispatch:
    types: [new-release]

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: no version specified"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Homebrew
    needs: resolve
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_homebrew) ||
      (github.event_name == 'repository_dispatch' && !github.event.client_payload.skip_homebrew)
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  winget:
    name: winget
    needs: resolve
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_winget) ||
      (github.event_name == 'repository_dispatch' && !github.event.client_payload.skip_winget)
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  chocolatey:
    name: Chocolatey
    needs: resolve
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_chocolatey) ||
      (github.event_name == 'repository_dispatch' && !github.event.client_payload.skip_chocolatey)
    uses: ./.github/workflows/chocolatey.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
